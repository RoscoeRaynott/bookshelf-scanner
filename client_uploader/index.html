<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: transparent;
      color: inherit;
      padding: 4px 2px;
      overflow: hidden;
    }
    .uploader-card {
      border: 2px dashed rgba(128, 128, 128, 0.4);
      border-radius: 10px;
      padding: 18px 12px;
      text-align: center;
      background: rgba(128, 128, 128, 0.05);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .uploader-card:hover, .uploader-card:active {
      border-color: #ff4b4b;
      background: rgba(255, 75, 75, 0.08);
    }
    .icon {
      font-size: 26px;
      margin-bottom: 6px;
      line-height: 1;
    }
    .btn-text {
      font-size: 15px;
      font-weight: 600;
      color: currentColor;
      margin-bottom: 3px;
    }
    .sub-text {
      font-size: 12px;
      opacity: 0.68;
    }
    #status-msg {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 500;
      color: #ff4b4b;
      display: none;
    }
    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>
  <label class="uploader-card" for="file-input" id="drop-zone">
    <div class="icon">📁</div>
    <div class="btn-text">Tap to Pick Shelf Photos (1 or more)</div>
    <div class="sub-text">Downscaled directly on phone &bull; Zero connection drops</div>
    <div id="status-msg"></div>
  </label>
  <input type="file" id="file-input" accept="image/*" multiple>

  <script>
    const fileInput = document.getElementById("file-input");
    const statusMsg = document.getElementById("status-msg");

    function sendMsg(type, data = {}) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: type,
        ...data
      }, "*");
    }

    function updateHeight() {
      const h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight, 110);
      sendMsg("streamlit:setFrameHeight", { height: h });
    }

    // Inform Streamlit this component is ready
    sendMsg("streamlit:componentReady", { apiVersion: 1 });

    window.addEventListener("load", updateHeight);
    window.addEventListener("resize", updateHeight);

    window.addEventListener("message", (event) => {
      if (event.data && event.data.type === "streamlit:render") {
        updateHeight();
      }
    });

    fileInput.addEventListener("change", async (e) => {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;

      statusMsg.style.display = "block";
      statusMsg.textContent = `Optimizing ${files.length} photo(s)...`;
      updateHeight();

      const results = [];
      const MAX_DIM = 2048;
      let hasDecodeError = false;

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const isHeic = /\.(heic|heif)$/i.test(file.name);
        if (isHeic) {
          hasDecodeError = true;
          break;
        }
        statusMsg.textContent = `Optimizing ${i + 1} of ${files.length}: ${file.name.substring(0, 18)}...`;
        try {
          const dataUrl = await resizeImage(file, MAX_DIM);
          results.push({
            name: file.name,
            size: file.size,
            data: dataUrl
          });
        } catch (err) {
          console.warn("Client decode failed for " + file.name, err);
          hasDecodeError = true;
          break;
        }
      }

      if (hasDecodeError) {
        statusMsg.textContent = "HEIC/unsupported format detected. Switching to standard uploader...";
        updateHeight();
        sendMsg("streamlit:setComponentValue", {
          value: {
            need_fallback: true,
            reason: "HEIC format detected"
          }
        });
        return;
      }

      if (results.length > 0) {
        statusMsg.textContent = `Uploading ${results.length} photo(s) to queue...`;
        updateHeight();
        sendMsg("streamlit:setComponentValue", {
          value: {
            batch_id: Date.now() + "_" + Math.random().toString(36).substring(2, 8),
            files: results
          }
        });
      }

      fileInput.value = "";
      setTimeout(() => {
        statusMsg.style.display = "none";
        updateHeight();
      }, 2000);
    });

    async function resizeImage(file, maxDim) {
      let bitmap;
      try {
        bitmap = await createImageBitmap(file, { imageOrientation: "from-image" });
      } catch (err) {
        try {
          bitmap = await createImageBitmap(file);
        } catch (err2) {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (re) => {
              const img = new Image();
              img.onload = () => {
                let w = img.naturalWidth || img.width;
                let h = img.naturalHeight || img.height;
                if (w > maxDim || h > maxDim) {
                  if (w > h) {
                    h = Math.round((h * maxDim) / w);
                    w = maxDim;
                  } else {
                    w = Math.round((w * maxDim) / h);
                    h = maxDim;
                  }
                }
                const canvas = document.createElement("canvas");
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, w, h);
                resolve(canvas.toDataURL("image/jpeg", 0.85));
              };
              img.onerror = reject;
              img.src = re.target.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
          });
        }
      }

      let w = bitmap.width;
      let h = bitmap.height;
      if (w > maxDim || h > maxDim) {
        if (w > h) {
          h = Math.round((h * maxDim) / w);
          w = maxDim;
        } else {
          w = Math.round((w * maxDim) / h);
          h = maxDim;
        }
      }
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(bitmap, 0, 0, w, h);
      bitmap.close();
      return canvas.toDataURL("image/jpeg", 0.85);
    }
  </script>
</body>
</html>
